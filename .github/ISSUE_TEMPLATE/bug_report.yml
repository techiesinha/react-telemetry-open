name: Bug Report
description: Something is not working correctly
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a bug. Please fill in as much detail as possible.

  - type: input
    id: version
    attributes:
      label: Package version
      placeholder: "1.0.0"
    validations:
      required: true

  - type: dropdown
    id: browser
    attributes:
      label: Browser
      options:
        - Chrome
        - Edge
        - Firefox
        - Safari
        - Other
    validations:
      required: true

  - type: input
    id: react_version
    attributes:
      label: React version
      placeholder: "18.3.0"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Wrap app with TelemetryProvider
        2. Click the button
        3. See error
    validations:
      required: true

  - type: textarea
    id: config
    attributes:
      label: Your TelemetryProvider setup
      description: Paste your TelemetryProvider usage and config (remove any secrets)
      render: tsx

  - type: textarea
    id: console
    attributes:
      label: Console output
      description: Paste any relevant console errors or telemetry output
      render: shell
